        // Play simple audio synthesizer sounds for toddler responsiveness
        function playKidSynthSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'pop') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'roar') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'splash') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.3);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'chirp') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.linearRampToValueAtTime(1800, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch(e) {
                console.log("Web Audio not supported or muted");
            }
        }

        // Native Browser Speech Synthesis Helper (Indonesian Voice)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any previous speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.85; // Slower pace for toddlers 3-4 y/o
                utterance.pitch = 1.2; // Slightly higher friendly pitch
                window.speechSynthesis.speak(utterance);
            }
        }

        // PCM16 ArrayBuffer to WAV Blob Converter for Gemini TTS
        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);

            /* RIFF identifier */
            writeString(view, 0, 'RIFF');
            /* RIFF chunk length */
            view.setUint32(4, 36 + pcmData.length * 2, true);
            /* RIFF type */
            writeString(view, 8, 'WAVE');
            /* format chunk identifier */
            writeString(view, 12, 'fmt ');
            /* format chunk length */
            view.setUint32(16, 16, true);
            /* sample format (raw PCM16) */
            view.setUint16(20, 1, true);
            /* channel count (mono) */
            view.setUint16(22, 1, true);
            /* sample rate */
            view.setUint32(24, sampleRate, true);
            /* byte rate (sampleRate * 2) */
            view.setUint32(28, sampleRate * 2, true);
            /* block align */
            view.setUint16(32, 2, true);
            /* bits per sample */
            view.setUint16(34, 16, true);
            /* data chunk identifier */
            writeString(view, 36, 'data');
            /* data chunk length */
            view.setUint32(40, pcmData.length * 2, true);

            // Write PCM samples
            let offset = 44;
            for (let i = 0; i < pcmData.length; i++, offset += 2) {
                view.setInt16(offset, pcmData[i], true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function App() {
            const [activeTab, setActiveTab] = useState('darat'); // 'darat', 'air', 'udara', 'kuis', 'studio'
            const [selectedAnimal, setSelectedAnimal] = useState(ANIMALS_DATA[0]);
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [aiGhibliImage, setAiGhibliImage] = useState(null);
            const [isTtsSpeaking, setIsTtsSpeaking] = useState(false);
            
            // Quiz State
            const [quizQuestion, setQuizQuestion] = useState(null);
            const [quizOptions, setQuizOptions] = useState([]);
            const [quizScore, setQuizScore] = useState(0);
            const [quizFeedback, setQuizFeedback] = useState('');

            // AI Custom Studio Prompt State
            const [customPrompt, setCustomPrompt] = useState('Kucing imut di kebun bunga Studio Ghibli');
            const [generatedStudioImg, setGeneratedStudioImg] = useState(null);

            // Initialize icons
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, selectedAnimal, quizQuestion]);

            // Welcome Sound on Load
            useEffect(() => {
                speakText("Selamat datang di Dunia Hewan Ghibli! Mari kita belajar sambil bermain!");
            }, []);

            // Generate Ghibli Image using Gemini API gemini-3.1-flash-image
            const fetchGhibliImage = async (animalName, customInstruction = '') => {
                setIsAiLoading(true);
                playKidSynthSound('pop');
                
                try {
                    const prompt = customInstruction || 
                        `Studio Ghibli anime style illustration of a super cute friendly child-friendly ${animalName}, warm watercolor aesthetic, Hayao Miyazaki film style, vibrant natural background, soft light, cozy atmosphere, highly detailed, masterpieces`;

                    const payload = {
                        contents: [{
                            parts: [{ text: prompt }]
                        }],
                        generationConfig: {
                            responseModalities: ['IMAGE'],
                            imageConfig: { aspectRatio: "1:1" }
                        }
                    };

                    const apiKey = ""; // Canvas runtime automatically supplies key
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${apiKey}`;

                    let response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    // Exponential Backoff retry if needed
                    if (!response.ok) {
                        await new Promise(r => setTimeout(r, 1000));
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    }

                    const result = await response.json();
                    const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

                    if (base64Data) {
                        const imgUrl = `data:image/png;base64,${base64Data}`;
                        if (customInstruction) {
                            setGeneratedStudioImg(imgUrl);
                        } else {
                            setAiGhibliImage(imgUrl);
                        }
                        playKidSynthSound('success');
                    } else {
                        console.log("Fallback to SVG preset");
                    }
                } catch (err) {
                    console.error("Ghibli image generation error:", err);
                } finally {
                    setIsAiLoading(false);
                }
            };

            // Call Gemini TTS for cute high-quality voice
            const speakWithGeminiTTS = async (text) => {
                setIsTtsSpeaking(true);
                // Fallback first for zero latency
                speakText(text);

                try {
                    const payload = {
                        contents: [{
                            parts: [{ text: `Katakan dengan nada gembira, hangat, dan ramah untuk anak kecil usia 3 tahun: "${text}"` }]
                        }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: "Aoede" } // Bright breezy voice
                                }
                            }
                        }
                    };

                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        const data = await res.json();
                        const inlineData = data?.candidates?.[0]?.content?.parts?.[0]?.inlineData;
                        if (inlineData && inlineData.data) {
                            // Convert PCM to WAV
                            const binary = atob(inlineData.data);
                            const bytes = new Uint8Array(binary.length);
                            for (let i = 0; i < binary.length; i++) {
                                bytes[i] = binary.charCodeAt(i);
                            }
                            const sampleRate = parseInt(inlineData.mimeType.match(/rate=(\d+)/)?.[1] || "24000", 10);
                            const pcm16 = new Int16Array(bytes.buffer);
                            const wavBlob = pcmToWav(pcm16, sampleRate);
                            const audioUrl = URL.createObjectURL(wavBlob);
                            
                            // Stop browser TTS and play Gemini TTS WAV
                            window.speechSynthesis.cancel();
                            const audio = new Audio(audioUrl);
                            audio.play();
                        }
                    }
                } catch (e) {
                    console.log("Using browser voice fallback:", e);
                } finally {
                    setTimeout(() => setIsTtsSpeaking(false), 2000);
                }
            };

            // Select an Animal Card
            const handleSelectAnimal = (animal) => {
                playKidSynthSound(animal.habitat === 'air' ? 'splash' : animal.habitat === 'udara' ? 'chirp' : 'pop');
                setSelectedAnimal(animal);
                setAiGhibliImage(null); // Reset until generated or kept default
                speakText(animal.name + "! " + animal.soundText);
            };

            // Start or Generate New Quiz Question
            const startNewQuiz = () => {
                const randomAnimal = ANIMALS_DATA[Math.floor(Math.random() * ANIMALS_DATA.length)];
                setQuizQuestion(randomAnimal);
                setQuizFeedback('');

                // Pick 3 options including correct answer
                const wrongOptions = ANIMALS_DATA.filter(a => a.id !== randomAnimal.id);
                const shuffledWrong = wrongOptions.sort(() => 0.5 - Math.random()).slice(0, 2);
                const options = [randomAnimal, ...shuffledWrong].sort(() => 0.5 - Math.random());
                setQuizOptions(options);

                speakText(`Mana hewan yang hidup di ${randomAnimal.habitat}? Coba tebak ${randomAnimal.name}!`);
            };

            // Handle Quiz Option Click
            const handleQuizAnswer = (chosen) => {
                if (chosen.id === quizQuestion.id) {
                    playKidSynthSound('success');
                    setQuizScore(prev => prev + 1);
                    setQuizFeedback('🎉 Horeee! Jawabanmu Benar Sekali!');
                    speakText('Horeee! Jawabanmu Benar Sekali! Pintar!');
                    
                    if (window.confetti) {
                        window.confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
                    }

                    setTimeout(() => {
                        startNewQuiz();
                    }, 2500);
                } else {
                    playKidSynthSound('pop');
                    setQuizFeedback('😊 Ayo coba lagi ya sayang!');
                    speakText('Ayo coba lagi!');
                }
            };

            useEffect(() => {
                if (activeTab === 'kuis') {
                    startNewQuiz();
                }
            }, [activeTab]);

            // Filter Animals by Current Habitat Tab
            const filteredAnimals = ANIMALS_DATA.filter(a => a.habitat === activeTab);

            return (
                <div className={`min-h-screen flex flex-col justify-between transition-colors duration-500 ${
                    activeTab === 'darat' ? 'bg-ghibli-land' : 
                    activeTab === 'air' ? 'bg-ghibli-water' : 
                    activeTab === 'udara' ? 'bg-ghibli-air' : 'bg-emerald-50'
                }`}>
                    
                    <header className="p-4 md:p-6 bg-white/80 backdrop-blur-md shadow-lg rounded-b-3xl flex flex-wrap items-center justify-between gap-4 border-b-4 border-emerald-200">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => speakText("Dunia Hewan Studio Ghibli")}>
                            <span className="text-4xl animate-bounce">🍃</span>
                            <div>
                                <h1 className="text-2xl md:text-3xl font-extrabold text-emerald-800 tracking-wide">
                                    Dunia Hewan Ghibli
                                </h1>
                                <p className="text-xs md:text-sm font-semibold text-emerald-600">
                                    Belajar Mengenal Hewan Usia 3-4 Tahun
                                </p>
                            </div>
                        </div>

                        <!-- Top Action Controls -->
                        <div className="flex items-center gap-2">
                            <button 
                                onClick={() => speakText("Halo adik-adik manis! Pilih habitat di bawah untuk menjelajah!")}
                                className="bg-amber-400 hover:bg-amber-500 text-amber-900 font-bold px-4 py-2.5 rounded-2xl shadow-md flex items-center gap-2 hover-wiggle text-sm md:text-base border-b-4 border-amber-600">
                                <span className="text-xl">🔊</span>
                                <span>Bantuan Suara</span>
                            </button>
                        </div>
                    </header>

                    <nav className="p-4 max-w-4xl mx-auto w-full">
                        <div className="bg-white/90 p-2.5 rounded-3xl shadow-md border-2 border-emerald-100 flex flex-wrap justify-center gap-2 md:gap-4">
                            <button 
                                onClick={() => { setActiveTab('darat'); setSelectedAnimal(ANIMALS_DATA[0]); speakText("Lingkungan Hewan di Darat"); }}
                                className={`flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-bold text-base md:text-lg flex items-center justify-center gap-2 transition-all shadow-sm ${
                                    activeTab === 'darat' 
                                    ? 'bg-emerald-500 text-white shadow-lg scale-105 border-b-4 border-emerald-700' 
                                    : 'bg-emerald-50 text-emerald-800 hover:bg-emerald-100'
                                }`}>
                                <span className="text-2xl">🏞️</span>
                                <span>Darat</span>
                            </button>

                            <button 
                                onClick={() => { setActiveTab('air'); setSelectedAnimal(ANIMALS_DATA[6]); speakText("Lingkungan Hewan di Air"); }}
                                className={`flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-bold text-base md:text-lg flex items-center justify-center gap-2 transition-all shadow-sm ${
                                    activeTab === 'air' 
                                    ? 'bg-sky-500 text-white shadow-lg scale-105 border-b-4 border-sky-700' 
                                    : 'bg-sky-50 text-sky-800 hover:bg-sky-100'
                                }`}>
                                <span className="text-2xl">🌊</span>
                                <span>Air</span>
                            </button>

                            <button 
                                onClick={() => { setActiveTab('udara'); setSelectedAnimal(ANIMALS_DATA[12]); speakText("Lingkungan Hewan di Udara"); }}
                                className={`flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-bold text-base md:text-lg flex items-center justify-center gap-2 transition-all shadow-sm ${
                                    activeTab === 'udara' 
                                    ? 'bg-amber-400 text-amber-950 shadow-lg scale-105 border-b-4 border-amber-600' 
                                    : 'bg-amber-50 text-amber-900 hover:bg-amber-100'
                                }`}>
                                <span className="text-2xl">☁️</span>
                                <span>Udara</span>
                            </button>

                            <button 
                                onClick={() => { setActiveTab('kuis'); speakText("Kuis Tebak Hewan Seru"); }}
                                className={`py-3 px-5 rounded-2xl font-bold text-base md:text-lg flex items-center justify-center gap-2 transition-all shadow-sm ${
                                    activeTab === 'kuis' 
                                    ? 'bg-purple-600 text-white shadow-lg scale-105 border-b-4 border-purple-800' 
                                    : 'bg-purple-50 text-purple-800 hover:bg-purple-100'
                                }`}>
                                <span className="text-2xl">🎮</span>
                                <span>Kuis</span>
                            </button>

                            <button 
                                onClick={() => { setActiveTab('studio'); speakText("Studio Gambar AI Ghibli"); }}
                                className={`py-3 px-5 rounded-2xl font-bold text-base md:text-lg flex items-center justify-center gap-2 transition-all shadow-sm ${
                                    activeTab === 'studio' 
                                    ? 'bg-rose-500 text-white shadow-lg scale-105 border-b-4 border-rose-700' 
                                    : 'bg-rose-50 text-rose-800 hover:bg-rose-100'
                                }`}>
                                <span className="text-2xl">🎨</span>
                                <span>Ghibli AI</span>
                            </button>
                        </div>
                    </nav>

                    <main className="flex-1 max-w-6xl mx-auto w-full p-4">
                        {(activeTab === 'darat' || activeTab === 'air' || activeTab === 'udara') && (
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
                                
                                <!-- Animal List Selection Panel (Left Column) -->
                                <div className="md:col-span-5 bg-white/90 backdrop-blur-sm p-4 rounded-3xl shadow-xl border-4 border-white/80">
                                    <h2 className="text-xl font-bold text-slate-700 mb-3 flex items-center gap-2">
                                        <span>Pilih Hewan {activeTab === 'darat' ? '🏞️' : activeTab === 'air' ? '🌊' : '☁️'}</span>
                                    </h2>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        {filteredAnimals.map((animal) => (
                                            <button
                                                key={animal.id}
                                                onClick={() => handleSelectAnimal(animal)}
                                                className={`p-3 rounded-2xl flex flex-col items-center gap-1 transition-all duration-300 border-b-4 hover-wiggle ${
                                                    selectedAnimal.id === animal.id
                                                    ? `bg-gradient-to-b ${animal.color} text-slate-900 font-extrabold shadow-md border-amber-500 scale-105`
                                                    : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'
                                                }`}>
                                                <span className="text-4xl md:text-5xl animate-float">{animal.emoji}</span>
                                                <span className="text-base font-bold mt-1">{animal.name}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <!-- Active Animal Detail Card & Interactive Ghibli Viewer (Right Column) -->
                                <div className="md:col-span-7 bg-white/95 backdrop-blur-md p-6 rounded-3xl shadow-2xl border-4 border-white flex flex-col items-center text-center relative overflow-hidden">
                                    
                                    <!-- Habitat Badge -->
                                    <div className="absolute top-4 left-4 bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-300 flex items-center gap-1">
                                        <span>Lingkungan:</span>
                                        <span className="capitalize font-extrabold">{selectedAnimal.habitat}</span>
                                    </div>

                                    <!-- Main Display Image / Dynamic AI Ghibli Artwork -->
                                    <div className="w-full max-w-xs sm:max-w-sm aspect-square bg-gradient-to-b from-amber-50 to-orange-50 rounded-3xl p-4 my-2 flex items-center justify-center shadow-inner border-4 border-amber-200 relative group">
                                        {isAiLoading ? (
                                            <div className="flex flex-col items-center gap-3">
                                                <div className="w-16 h-16 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                                                <p className="text-emerald-700 font-bold animate-pulse text-sm">
                                                    🎨 Sedang Menggambar Gaya Ghibli...
                                                </p>
                                            </div>
                                        ) : aiGhibliImage ? (
                                            <img 
                                                src={aiGhibliImage} 
                                                alt={selectedAnimal.name} 
                                                className="w-full h-full object-cover rounded-2xl shadow-md border-2 border-white"
                                            />
                                        ) : (
                                            <div 
                                                className="w-full h-full flex flex-col items-center justify-center p-4 cursor-pointer"
                                                onClick={() => speakText(selectedAnimal.name)}
                                                dangerouslySetInnerHTML={{ __html: selectedAnimal.svgAsset }}
                                            />
                                        )}

                                        <!-- Generate Ghibli Button Badge -->
                                        <button 
                                            onClick={() => fetchGhibliImage(selectedAnimal.name)}
                                            className="absolute bottom-3 right-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-xs px-3 py-2 rounded-xl shadow-lg hover:scale-105 transition-all flex items-center gap-1 border border-white">
                                            <span>✨ Gambar Ghibli AI</span>
                                        </button>
                                    </div>

                                    <!-- Animal Title & Sound Buttons -->
                                    <h3 className="text-3xl font-extrabold text-slate-800 mt-2 flex items-center gap-2">
                                        <span>{selectedAnimal.name}</span>
                                        <span className="text-3xl">{selectedAnimal.emoji}</span>
                                    </h3>

                                    <!-- Audio Interaction Buttons -->
                                    <div className="flex flex-wrap justify-center gap-3 my-3">
                                        <button 
                                            onClick={() => {
                                                playKidSynthSound(selectedAnimal.habitat === 'air' ? 'splash' : 'roar');
                                                speakWithGeminiTTS(selectedAnimal.soundText);
                                            }}
                                            className="bg-amber-400 hover:bg-amber-500 text-amber-950 px-5 py-3 rounded-2xl font-bold text-base shadow-md flex items-center gap-2 hover-wiggle border-b-4 border-amber-600 active:translate-y-1">
                                            <span className="text-2xl">🔊</span>
                                            <span>Dengarkan Suara</span>
                                        </button>

                                        <button 
                                            onClick={() => speakWithGeminiTTS(selectedAnimal.fact)}
                                            className="bg-sky-400 hover:bg-sky-500 text-sky-950 px-5 py-3 rounded-2xl font-bold text-base shadow-md flex items-center gap-2 hover-wiggle border-b-4 border-sky-600 active:translate-y-1">
                                            <span className="text-2xl">💡</span>
                                            <span>Fakta Unik</span>
                                        </button>
                                    </div>

                                    <!-- Fun Fact Text Banner -->
                                    <div className="bg-amber-50/90 border-2 border-amber-200 p-4 rounded-2xl w-full text-center mt-1">
                                        <p className="text-slate-700 font-bold text-base md:text-lg leading-relaxed">
                                            "{selectedAnimal.fact}"
                                        </p>
                                    </div>

                                </div>
                            </div>
                        )}

                        {activeTab === 'kuis' && quizQuestion && (
                            <div className="max-w-2xl mx-auto bg-white/95 backdrop-blur-md p-6 md:p-8 rounded-3xl shadow-2xl border-4 border-purple-200 text-center">
                                <div className="flex items-center justify-between mb-4">
                                    <span className="bg-purple-100 text-purple-800 font-extrabold px-4 py-2 rounded-2xl text-sm border border-purple-300">
                                        🏆 Skor Anak Pintar: {quizScore}
                                    </span>
                                    <button 
                                        onClick={startNewQuiz}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-xl text-xs">
                                        🔄 Soal Baru
                                    </button>
                                </div>

                                <h2 className="text-2xl md:text-3xl font-extrabold text-slate-800 my-4">
                                    Mana hewan yang hidup di <span className="text-purple-600 underline capitalize">{quizQuestion.habitat}</span>? 🤔
                                </h2>

                                <p className="text-lg text-slate-600 font-bold mb-6">
                                    Cari hewan bernama: <span className="text-amber-600 font-black text-2xl">{quizQuestion.name}</span>!
                                </p>

                                <!-- Quiz Answer Options -->
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 my-6">
                                    {quizOptions.map((option) => (
                                        <button
                                            key={option.id}
                                            onClick={() => handleQuizAnswer(option)}
                                            className="bg-gradient-to-b from-purple-50 to-pink-50 hover:from-purple-100 hover:to-pink-100 border-4 border-purple-200 p-5 rounded-3xl shadow-lg flex flex-col items-center gap-2 hover-wiggle transition-all active:scale-95">
                                            <span className="text-6xl animate-bounce">{option.emoji}</span>
                                            <span className="text-xl font-black text-slate-800">{option.name}</span>
                                        </button>
                                    ))}
                                </div>

                                {quizFeedback && (
                                    <div className="p-4 rounded-2xl bg-amber-100 border-2 border-amber-300 text-amber-900 font-extrabold text-xl animate-pulse">
                                        {quizFeedback}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'studio' && (
                            <div className="max-w-3xl mx-auto bg-white/95 backdrop-blur-md p-6 md:p-8 rounded-3xl shadow-2xl border-4 border-rose-200">
                                <div className="text-center mb-6">
                                    <h2 className="text-3xl font-extrabold text-rose-800 flex items-center justify-center gap-2">
                                        <span>Studio Lukis Ghibli AI</span>
                                        <span>🎨</span>
                                    </h2>
                                    <p className="text-slate-600 font-bold mt-1">
                                        Buat gambar hewan apa saja dalam gaya animasi Studio Ghibli yang indah!
                                    </p>
                                </div>

                                <!-- Prompt Input Form -->
                                <div className="flex flex-col sm:flex-row gap-3 mb-6">
                                    <input 
                                        type="text" 
                                        value={customPrompt}
                                        onChange={(e) => setCustomPrompt(e.target.value)}
                                        placeholder="Contoh: Kelinci putih lucu terbang membawa balon..."
                                        className="flex-1 p-4 rounded-2xl border-2 border-rose-200 font-bold text-slate-700 shadow-inner focus:outline-none focus:border-rose-400 text-base"
                                    />
                                    <button 
                                        onClick={() => fetchGhibliImage('', customPrompt)}
                                        disabled={isAiLoading || !customPrompt.trim()}
                                        className="bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-extrabold px-6 py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-base border-b-4 border-rose-800 disabled:opacity-50">
                                        {isAiLoading ? (
                                            <span>🎨 Menggambar...</span>
                                        ) : (
                                            <>
                                                <span>✨</span>
                                                <span>Buat Gambar</span>
                                            </>
                                        )}
                                    </button>
                                </div>

                                <!-- Preset Ideas Chips -->
                                <div className="flex flex-wrap gap-2 justify-center mb-6">
                                    <span className="text-xs font-bold text-slate-500 py-1">Ide cepat:</span>
                                    {[
                                        'Gajah kecil mandi di sungai jernih Ghibli',
                                        'Burung hantu memakai topi rumput di hutan Ghibli',
                                        'Lumba-lumba menari dengan bintang laut Ghibli',
                                        'Singa bersahabat tidur di padang bunga Ghibli'
                                    ].map((preset, idx) => (
                                        <button 
                                            key={idx}
                                            onClick={() => {
                                                setCustomPrompt(preset);
                                                fetchGhibliImage('', preset);
                                            }}
                                            className="text-xs font-bold bg-rose-50 hover:bg-rose-100 text-rose-700 px-3 py-1.5 rounded-xl border border-rose-200">
                                            {preset}
                                        </button>
                                    ))}
                                </div>

                                <!-- Result Display Box -->
                                <div className="w-full aspect-square max-w-md mx-auto bg-rose-50/50 rounded-3xl border-4 border-dashed border-rose-200 flex items-center justify-center overflow-hidden relative shadow-inner p-4">
                                    {isAiLoading ? (
                                        <div className="flex flex-col items-center gap-3 text-center">
                                            <div className="w-16 h-16 border-4 border-rose-500 border-t-transparent rounded-full animate-spin"></div>
                                            <p className="text-rose-700 font-bold text-sm animate-pulse">
                                                Ghibli AI sedang melukis karya indahmu...
                                            </p>
                                        </div>
                                    ) : generatedStudioImg ? (
                                        <img 
                                            src={generatedStudioImg} 
                                            alt="Ghibli AI Result" 
                                            className="w-full h-full object-cover rounded-2xl shadow-lg border-2 border-white"
                                        />
                                    ) : (
                                        <div className="text-center text-slate-400 font-bold p-6">
                                            <span className="text-6xl block mb-2">🖼️</span>
                                            <span>Hasil gambar Ghibli buatanmu akan muncul di sini!</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="p-4 text-center bg-white/70 backdrop-blur-sm border-t-2 border-emerald-100 text-emerald-900 font-bold text-xs md:text-sm mt-6">
                        <p>🍃 Aplikasi Belajar Hewan Anak Usia 3-4 Tahun • Bergaya Animasi Ghibli ✨</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
